<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель секретаря</title>
<script src="/socket.io/socket.io.js"></script>

<style>
:root {
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #343047;
  background: #F7F5FC;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 28px clamp(14px, 3vw, 42px) 48px;
  background:
    radial-gradient(circle at 8% 0%, rgba(165,138,203,.17), transparent 30rem),
    radial-gradient(circle at 95% 8%, rgba(234,227,245,.75), transparent 28rem),
    #F7F5FC;
  color: #343047;
}

h1 {
  max-width: 1500px;
  margin: 0 auto 22px;
  color: #343047;
  font-size: clamp(24px, 3vw, 32px);
  font-weight: 800;
  letter-spacing: -.7px;
}

.toolbar,
.stats,
.stream-card,
.current-panel {
  background: #FFFFFF;
  border: 1px solid #EAE3F5;
  border-radius: 18px;
  box-shadow: 0 8px 28px rgba(52,48,71,.055);
}

.toolbar,
.stats,
.current-panel,
#streams {
  max-width: 1500px;
  margin-left: auto;
  margin-right: auto;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 15px;
  align-items: center;
  margin-bottom: 16px;
}

input {
  background: #F8F6FC;
  color: #343047;
  border: 1px solid #DCD2EA;
  border-radius: 11px;
  padding: 12px 14px;
  font: inherit;
  flex: 1;
  min-width: min(260px, 100%);
  outline: none;
}

input:focus {
  border-color: #A58ACB;
  box-shadow: 0 0 0 3px rgba(165,138,203,.2);
}

input::placeholder {
  color: #766F84;
}

.status {
  color: #655D75;
  font-size: 13px;
}

#connection {
  padding: 7px 11px;
  background: #F0EBF8;
  border-radius: 999px;
}

.current-panel {
  background: linear-gradient(
    125deg,
    #FFFFFF 0%,
    #F5F1FA 65%,
    #F0EBF8 100%
  );
  border: 1px solid #DCD2EA;
  border-radius: 20px;
  padding: clamp(18px, 3vw, 26px);
  margin-bottom: 18px;
}

.current-label {
  color: #76609F;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 1.5px;
}

.current-name {
  color: #343047;
  font-size: clamp(23px, 3vw, 31px);
  font-weight: 850;
  margin-top: 10px;
  letter-spacing: -.5px;
}

.current-info {
  color: #655D75;
  margin-top: 8px;
  line-height: 1.7;
}

.current-navigation {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 22px;
}

.current-navigation button {
  background: #76609F;
  color: #FFFFFF;
  border: 0;
  border-radius: 11px;
  padding: 12px 18px;
  font: inherit;
  font-weight: 750;
  cursor: pointer;
  transition: background .15s, transform .15s;
}

.current-navigation button:hover:not(:disabled) {
  background: #665187;
  transform: translateY(-1px);
}

.current-navigation button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#currentCounter {
  color: #594879;
  font-size: 16px;
  font-weight: 800;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

#navigationStatus {
  margin-top: 12px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 14px;
  margin-bottom: 18px;
}

.stat {
  background: #F8F6FC;
  border: 1px solid #EAE3F5;
  border-radius: 13px;
  padding: 13px 16px;
}

.stat span {
  display: block;
  color: #655D75;
  font-size: 12px;
  margin-bottom: 5px;
}

.stat strong {
  font-size: 25px;
  color: #403852;
  font-variant-numeric: tabular-nums;
}

.stream-card {
  margin: 0 auto 15px;
  max-width: 1500px;
  overflow: hidden;
}

.stream-heading {
  width: 100%;
  border: 0;
  padding: 17px 19px;
  color: #403852;
  background: #EAE3F5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: left;
  cursor: pointer;
  font: inherit;
  gap: 12px;
  transition: background .15s;
}

.stream-heading:hover {
  background: #DED3EE;
}

.stream-heading strong {
  color: #594879;
  font-size: 15px;
}

.stream-heading small {
  color: #655D75;
}

.stage-heading {
  padding: 11px 16px;
  background: #F5F1FA;
  color: #665486;
  font-weight: 800;
  border-top: 1px solid #EAE3F5;
}

.table-wrap {
  overflow-x: auto;
  width: 100%;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  min-width: 1180px;
}

th, td {
  padding: 11px 10px;
  border-bottom: 1px solid #EEEAF3;
  white-space: nowrap;
  text-align: center;
  font-size: 13px;
}

th {
  background: #F8F6FC;
  color: #514A60;
  position: sticky;
  top: 0;
  z-index: 2;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .35px;
}

td.name {
  text-align: left;
  min-width: 190px;
  font-weight: 700;
  color: #403852;
}

td.club {
  text-align: left;
  min-width: 150px;
  color: #655D75;
}

td.score {
  min-width: 62px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

td.score {
  cursor: pointer;
}

td.score:hover {
  background: #F0EBF8;
}

td.score input {
  width: 70px;
  min-width: 70px;
  padding: 5px;
  text-align: center;
  font: inherit;
}

td.received {
  color: #39745B;
}

td.missing {
  color: #817A8D;
}

td.total-score {
  color: #594879;
  font-weight: 850;
  font-size: 14px;
  background: #F3EFF9;
}

tbody tr:hover {
  background: #FAF8FD;
}

.count {
  color: #594879;
  font-weight: 800;
}

.hidden {
  display: none;
}

.empty {
  max-width: 1500px;
  margin: 0 auto;
  padding: 32px;
  text-align: center;
  color: #655D75;
  background: #FFFFFF;
  border: 1px solid #EAE3F5;
  border-radius: 16px;
}

@media (max-width: 700px) {
  body {
    padding: 18px 10px 32px;
  }

  h1 {
    font-size: 23px;
    margin-bottom: 16px;
  }

  .current-name {
    font-size: 23px;
  }

  .current-navigation button {
    padding: 11px 12px;
    font-size: 13px;
  }

  .stats {
    gap: 7px;
    padding: 9px;
  }

  .stat {
    padding: 11px 9px;
  }

  .stat strong {
    font-size: 21px;
  }
}

@media (max-width: 420px) {
  .current-navigation {
    gap: 6px;
  }

  #currentCounter {
    font-size: 13px;
  }

  .current-navigation button {
    padding: 10px 8px;
  }

  .stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<h1>🏆 Панель секретаря</h1>

<div class="toolbar">
  <input
    id="search"
    type="search"
    placeholder="Найти участницу, номер, клуб или вид"
  >

  <span id="connection" class="status">
    Подключение...
  </span>
</div>

<!-- ПАНЕЛЬ ТЕКУЩЕГО ВЫСТУПЛЕНИЯ -->

<div class="current-panel">

  <div class="current-label">
    ТЕКУЩЕЕ ВЫСТУПЛЕНИЕ
  </div>

  <div id="currentName" class="current-name">
    Ожидание данных...
  </div>

  <div id="currentInfo" class="current-info"></div>

  <div class="current-navigation">

    <button id="secretaryPrev" type="button" disabled>
      ‹ Предыдущая
    </button>

    <strong id="currentCounter">— / —</strong>

    <button id="secretaryNext" type="button" disabled>
      Следующая ›
    </button>

  </div>

  <div id="navigationStatus" class="status">
    Переключение доступно секретарю и всем судьям
  </div>

</div>

<!-- СТАТИСТИКА -->

<div class="stats">

  <div class="stat">
    <span>Выступлений</span>
    <strong id="participants">—</strong>
  </div>

  <div class="stat">
    <span>Получено оценок</span>
    <strong id="received">—</strong>
  </div>

  <div class="stat">
    <span>Полностью оценено</span>
    <strong id="complete">—</strong>
  </div>

</div>

<!-- ТАБЛИЦЫ РЕЗУЛЬТАТОВ -->

<div id="streams"></div>

<script>
const socket = io();

const roles = [
  "DA1", "DA2", "DB1", "DB2",
  "E1", "E2", "A1", "A2"
];

const state = {
  gymnasts: [],
  scores: {},
  collapsed: new Set(),
  currentIndex: 0
};

const $ = id => document.getElementById(id);

/* =========================
   ПОДКЛЮЧЕНИЕ
========================= */

socket.on("connect", () => {
  $("connection").textContent = "● Сервер подключён";
});

socket.on("disconnect", () => {
  $("connection").textContent =
    "Нет соединения — переподключение...";
});

socket.on("connect_error", () => {
  $("connection").textContent =
    "Ошибка подключения к серверу";
});

/* =========================
   ПЕРВИЧНАЯ ЗАГРУЗКА
========================= */

socket.on("init_data", data => {
  state.gymnasts = data.gymnasts || [];
  state.scores = data.scores || {};
  state.currentIndex = Number(data.currentIndex) || 0;

  render();
  updateCurrentPerformance();
});

/* =========================
   ОБЩЕЕ ПЕРЕКЛЮЧЕНИЕ
========================= */

socket.on("gymnast_changed", data => {
  state.currentIndex = Number(data.currentIndex) || 0;

  updateCurrentPerformance();
});

/* =========================
   ПОЛУЧЕНИЕ ОЦЕНОК
========================= */

socket.on("score_updated", data => {
  const key = `${data.gymnastId}_${data.judgeRole}`;

  state.scores[key] = Number(data.score);

  render();
});

/* =========================
   ТЕКУЩАЯ ГИМНАСТКА
========================= */

function updateCurrentPerformance() {
  const gymnasts = state.gymnasts;

  if (!gymnasts.length) {
    $("currentName").textContent =
      "Нет данных об участницах";

    $("currentInfo").textContent = "";
    $("currentCounter").textContent = "— / —";

    $("secretaryPrev").disabled = true;
    $("secretaryNext").disabled = true;

    return;
  }

  const index = state.currentIndex;
  const g = gymnasts[index];

  if (!g) return;

  $("currentName").textContent =
    `№${g.number} ${g.name}`;

  $("currentInfo").textContent = [
    g.stream,
    `Вид ${g.stageIndex}: ${g.apparatus}`,
    g.club,
    g.group,
    g.streamTime
  ].filter(Boolean).join(" · ");

  $("currentCounter").textContent =
    `${index + 1} / ${gymnasts.length}`;

  $("secretaryPrev").disabled = index <= 0;

  $("secretaryNext").disabled =
    index >= gymnasts.length - 1;
}

/* =========================
   ПЕРЕКЛЮЧЕНИЕ СЕКРЕТАРЁМ
========================= */

function moveSecretary(delta) {
  const nextIndex = state.currentIndex + delta;

  if (
    nextIndex < 0 ||
    nextIndex >= state.gymnasts.length
  ) {
    return;
  }

  $("navigationStatus").textContent =
    "Переключение...";

  $("secretaryPrev").disabled = true;
  $("secretaryNext").disabled = true;

  socket.timeout(8000).emit(
    "set_gymnast_index",
    nextIndex,
    (error, response) => {

      if (error) {
        $("navigationStatus").textContent =
          "Нет подтверждения от сервера";

        updateCurrentPerformance();
        return;
      }

      if (!response?.ok) {
        $("navigationStatus").textContent =
          response?.error || "Ошибка переключения";

        updateCurrentPerformance();
        return;
      }

      $("navigationStatus").textContent =
        "Текущая гимнастка обновлена у всех судей";
    }
  );
}

$("secretaryPrev").onclick = () =>
  moveSecretary(-1);

$("secretaryNext").onclick = () =>
  moveSecretary(1);

/* =========================
   ПОЛУЧЕНИЕ ОЦЕНКИ СУДЬИ
========================= */

function getScore(id, role) {
  const value = state.scores[`${id}_${role}`];

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {
    return null;
  }

  const number = Number(value);

  return Number.isFinite(number) ? number : null;
}

/* =========================
   СРЕДНЕЕ ДВУХ СУДЕЙ
========================= */

function groupScore(first, second) {
  if (first !== null && second !== null) {
    return (first + second) / 2;
  }

  if (first !== null) return first;
  if (second !== null) return second;

  return null;
}

/* =========================
   ИТОГ ЗА ВЫСТУПЛЕНИЕ
========================= */

function calculateTotal(id) {
  const DA = groupScore(
    getScore(id, "DA1"),
    getScore(id, "DA2")
  );

  const DB = groupScore(
    getScore(id, "DB1"),
    getScore(id, "DB2")
  );

  const E = groupScore(
    getScore(id, "E1"),
    getScore(id, "E2")
  );

  const A = groupScore(
    getScore(id, "A1"),
    getScore(id, "A2")
  );

  if ([DA, DB, E, A].some(value => value === null)) {
    return null;
  }

  return 20 + DA + DB - E - A;
}

/* =========================
   КОЛИЧЕСТВО ОЦЕНОК
========================= */

function scoreCount(g) {
  return roles.filter(role =>
    getScore(g.id, role) !== null
  ).length;
}

/* =========================
   СОЗДАНИЕ ЯЧЕЙКИ
========================= */

function createCell(row, text, className = "") {
  const td = document.createElement("td");

  td.textContent = text ?? "—";
  td.className = className;

  row.append(td);
}

/* =========================
   ФОРМАТ ОЦЕНКИ
========================= */

function formatScore(number) {
  if (number === null) return "—";

  return number.toLocaleString("ru-RU", {
    maximumFractionDigits: 3
  });
}

function editScoreCell(td, performanceId, role, currentScore) {
  if (td.querySelector("input")) return;

  const input = document.createElement("input");
  input.type = "text";
  input.inputMode = "decimal";
  input.value = currentScore === null ? "" : String(currentScore);

  td.textContent = "";
  td.append(input);
  input.focus();
  input.select();

  function cancel() {
    td.textContent = formatScore(currentScore);
  }

  function save() {
    const value = input.value.trim().replace(",", ".");

    if (!value) {
      alert("Введите оценку.");
      input.focus();
      return;
    }

    socket.timeout(8000).emit("submit_score", {
      gymnastId: performanceId,
      judgeRole: role,
      score: value
    }, (error, response) => {
      if (error) {
        alert("Не удалось получить ответ от сервера.");
        render();
        return;
      }

      if (!response?.ok) {
        alert(response?.error || "Не удалось сохранить оценку.");
        render();
        return;
      }

      state.scores[`${performanceId}_${role}`] = Number(response.score);
      render();
    });
  }

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      save();
    }

    if (event.key === "Escape") {
      cancel();
    }
  });
}

/* =========================
   ОТРИСОВКА ТАБЛИЦ
========================= */

function render() {
  const query = $("search").value.trim().toLocaleLowerCase("ru");
  const all = [...state.gymnasts];

  const filtered = all.filter(g => {
    const fields = [
      g.number,
      g.name,
      g.birthYear,
      g.club,
      g.group,
      g.stream,
      g.apparatus
    ];

    return fields.some(value =>
      String(value || "").toLocaleLowerCase("ru").includes(query)
    );
  });

  $("participants").textContent = all.length;
  $("received").textContent = all.reduce(
    (sum, g) => sum + scoreCount(g), 0
  );
  $("complete").textContent = all.filter(g =>
    calculateTotal(g.id) !== null
  ).length;

  const groups = new Map();

  for (const g of filtered) {
    if (!groups.has(g.stream)) groups.set(g.stream, []);
    groups.get(g.stream).push(g);
  }

  const container = $("streams");
  container.replaceChildren();

  if (!filtered.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Выступления не найдены";
    container.append(p);
    return;
  }

  for (const [stream, items] of groups) {
    const card = document.createElement("section");
    card.className = "stream-card";

    const heading = document.createElement("button");
    heading.className = "stream-heading";

    const title = document.createElement("span");
    const strong = document.createElement("strong");
    const small = document.createElement("small");

    strong.textContent = stream;
    small.textContent = ` · ${items[0].streamTime || ""}`;

    title.append(strong, small);
    heading.append(title);

    const body = document.createElement("div");

    // Собираем все виды в этом потоке.
    const stages = [...new Set(items.map(g => g.stageIndex))]
      .sort((a, b) => a - b);

    // Объединяем выступления одной гимнастки.
    const participants = new Map();

    for (const g of items) {
      const key = g.sourceId;

      if (!participants.has(key)) {
        participants.set(key, {
          info: g,
          performances: new Map(),
          sourceOrder: participants.size
        });
      }

      participants.get(key).performances.set(g.stageIndex, g);
    }

    const rows = [...participants.values()].map(person => {
      let total = 0;
      let complete = true;

      for (const stage of stages) {
        const performance = person.performances.get(stage);

        if (!performance) continue;

        const stageTotal = calculateTotal(performance.id);

        if (stageTotal === null) {
          complete = false;
        } else {
          total += stageTotal;
        }
      }

      return {
        ...person,
        total: complete ? total : null
      };
    });

    // Завершённые результаты сверху, по убыванию суммы.
    rows.sort((a, b) => {
      if (a.total === null && b.total !== null) return 1;
      if (a.total !== null && b.total === null) return -1;

      if (a.total !== null && b.total !== null) {
        return b.total - a.total;
      }

      return a.sourceOrder - b.sourceOrder;
    });

    const wrap = document.createElement("div");
    wrap.className = "table-wrap";

    const table = document.createElement("table");
    const thead = document.createElement("thead");

    // Первая строка заголовка.
    const topRow = document.createElement("tr");

    const commonHeaders = [
      ["№", 1],
      ["Гимнастка / команда", 1],
      ["Год", 1],
      ["Клуб / город", 1],
      ["Категория", 1]
    ];

    for (const [label, span] of commonHeaders) {
      const th = document.createElement("th");
      th.textContent = label;
      th.rowSpan = 2;
      th.colSpan = span;
      topRow.append(th);
    }

    for (const stage of stages) {
      const stageParticipants = items.filter(
        g => g.stageIndex === stage
      );

      const apparatus = stageParticipants[0]?.apparatus || `Вид ${stage}`;

      const th = document.createElement("th");
      th.textContent = `${apparatus} · Вид ${stage}`;
      th.colSpan = 10;
      topRow.append(th);
    }

    const totalHeader = document.createElement("th");
    totalHeader.textContent = "Общая сумма";
    totalHeader.rowSpan = 2;
    topRow.append(totalHeader);

    const placeHeader = document.createElement("th");
    placeHeader.textContent = "Место";
    placeHeader.rowSpan = 2;
    topRow.append(placeHeader);

    // Вторая строка заголовка.
    const secondRow = document.createElement("tr");

    for (const stage of stages) {
      const apparatusHeader = document.createElement("th");
      apparatusHeader.textContent = "Вид";
      secondRow.append(apparatusHeader);
      for (const role of roles) {
        const th = document.createElement("th");
        th.textContent = role;
        secondRow.append(th);
      }

      const th = document.createElement("th");
      th.textContent = "Итог за вид";
      secondRow.append(th);
    }

    thead.append(topRow, secondRow);
    table.append(thead);

    const tbody = document.createElement("tbody");

    let previousTotal = null;
    let previousPlace = 0;
    let completedCount = 0;

    for (let i = 0; i < rows.length; i++) {
      const person = rows[i];
      const g = person.info;
      const row = document.createElement("tr");

      createCell(row, g.number);
      createCell(row, g.name, "name");
      createCell(row, g.birthYear);
      createCell(row, g.club, "club");
      createCell(row, g.group);

      for (const stage of stages) {
        const performance = person.performances.get(stage);
        createCell(row, performance?.apparatus || "—");
        
        for (const role of roles) {
          const score = performance
            ? getScore(performance.id, role)
            : null;

          const cell = document.createElement("td");
          cell.textContent = formatScore(score);
          cell.className = `score ${score === null ? "missing" : "received"}`;

          if (performance) {
            cell.title = "Нажмите, чтобы изменить оценку";
            cell.addEventListener("click", () => {
              editScoreCell(cell, performance.id, role, score);
            });
          }

          row.append(cell);
        }

        const stageTotal = performance
          ? calculateTotal(performance.id)
          : null;

        createCell(
          row,
          formatScore(stageTotal),
          "total-score"
        );
      }

      createCell(
        row,
        formatScore(person.total),
        "total-score"
      );

      let place = "—";

      if (person.total !== null) {
        completedCount++;

        if (person.total !== previousTotal) {
          previousPlace = completedCount;
        }

        place = previousPlace;
        previousTotal = person.total;
      }

      createCell(row, place, "total-score");

      tbody.append(row);
    }

    table.append(tbody);
    wrap.append(table);
    body.append(wrap);

    if (state.collapsed.has(stream)) {
      body.classList.add("hidden");
    }

    heading.onclick = () => {
      if (state.collapsed.has(stream)) {
        state.collapsed.delete(stream);
      } else {
        state.collapsed.add(stream);
      }

      render();
    };

    card.append(heading, body);
    container.append(card);
  }
}

$("search").addEventListener("input", render);

</script>

</body>
</html>
