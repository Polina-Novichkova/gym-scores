
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель секретаря</title>
<script src="/socket.io/socket.io.js"></script>

<style>
:root {
  color-scheme: dark;
  font-family: system-ui, Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #0b1220;
  color: #f8fafc;
}

h1 {
  color: #7dd3fc;
  font-size: 27px;
}

/* Общие блоки */

.toolbar,
.stats,
.stream-card,
.current-panel {
  background: #172033;
  border: 1px solid #29364e;
  border-radius: 12px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px;
  align-items: center;
  margin-bottom: 14px;
}

input {
  background: #0b1220;
  color: white;
  border: 1px solid #40506b;
  border-radius: 8px;
  padding: 11px;
  font: inherit;
  flex: 1;
  min-width: 220px;
}

.status {
  color: #aab7cc;
  font-size: 13px;
}

/* Панель текущей гимнастки */

.current-panel {
  background: #172b43;
  border: 1px solid #38bdf8;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}

.current-label {
  color: #7dd3fc;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;
}

.current-name {
  color: #ffffff;
  font-size: 27px;
  font-weight: 800;
  margin-top: 10px;
}

.current-info {
  color: #cbd5e1;
  margin-top: 7px;
  line-height: 1.6;
}

.current-navigation {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
}

.current-navigation button {
  background: #2563eb;
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 12px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

.current-navigation button:hover:not(:disabled) {
  background: #1d4ed8;
}

.current-navigation button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

#currentCounter {
  color: #facc15;
  font-size: 17px;
  white-space: nowrap;
}

#navigationStatus {
  margin-top: 12px;
}

/* Статистика */

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 24px;
  padding: 14px;
  margin-bottom: 16px;
}

.stat span {
  display: block;
  color: #aab7cc;
  font-size: 12px;
}

.stat strong {
  font-size: 23px;
}

/* Потоки */

.stream-card {
  margin-bottom: 14px;
  overflow: hidden;
}

.stream-heading {
  width: 100%;
  border: 0;
  padding: 15px;
  color: white;
  background: #1e3552;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: left;
  cursor: pointer;
  font: inherit;
  gap: 12px;
}

.stream-heading strong {
  color: #bae6fd;
}

.stream-heading small {
  color: #cbd5e1;
}

.stage-heading {
  padding: 10px 14px;
  background: #26334a;
  color: #facc15;
  font-weight: 750;
  border-top: 1px solid #40506b;
}

.table-wrap {
  overflow-x: auto;
  width: 100%;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  min-width: 1180px;
}

th, td {
  padding: 10px 9px;
  border-bottom: 1px solid #29364e;
  white-space: nowrap;
  text-align: center;
  font-size: 13px;
}

th {
  background: #172033;
  color: #bae6fd;
  position: sticky;
  top: 0;
  z-index: 2;
}

td.name {
  text-align: left;
  min-width: 190px;
  font-weight: 600;
}

td.club {
  text-align: left;
  min-width: 150px;
  color: #aab7cc;
}

td.score {
  min-width: 62px;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

td.received {
  color: #86efac;
}

td.missing {
  color: #64748b;
}

td.total-score {
  color: #facc15;
  font-weight: 800;
  font-size: 14px;
  background: #26334a;
}

tbody tr:hover {
  background: #1b2a40;
}

.count {
  color: #bae6fd;
  font-weight: 700;
}

.hidden {
  display: none;
}

.empty {
  padding: 25px;
  text-align: center;
  color: #aab7cc;
}

@media (max-width: 700px) {
  body {
    padding: 10px;
  }

  h1 {
    font-size: 22px;
  }

  .current-name {
    font-size: 22px;
  }

  .current-navigation button {
    padding: 10px;
    font-size: 13px;
  }
}

@media (max-width: 400px) {
  .current-navigation {
    gap: 6px;
  }

  #currentCounter {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<h1>🏆 Панель секретаря</h1>

<div class="toolbar">
  <input
    id="search"
    type="search"
    placeholder="Найти участницу, номер, клуб или вид"
  >

  <span id="connection" class="status">
    Подключение...
  </span>
</div>

<!-- ПАНЕЛЬ УПРАВЛЕНИЯ ВСЕМИ СУДЬЯМИ -->

<div class="current-panel">

  <div class="current-label">
    ТЕКУЩЕЕ ВЫСТУПЛЕНИЕ
  </div>

  <div id="currentName" class="current-name">
    Ожидание данных...
  </div>

  <div id="currentInfo" class="current-info"></div>

  <div class="current-navigation">

    <button id="secretaryPrev" type="button" disabled>
      ‹ Предыдущая
    </button>

    <strong id="currentCounter">— / —</strong>

    <button id="secretaryNext" type="button" disabled>
      Следующая ›
    </button>

  </div>

  <div id="navigationStatus" class="status">
    Переключение доступно секретарю и всем судьям
  </div>

</div>

<!-- СТАТИСТИКА -->

<div class="stats">

  <div class="stat">
    <span>Выступлений</span>
    <strong id="participants">—</strong>
  </div>

  <div class="stat">
    <span>Получено оценок</span>
    <strong id="received">—</strong>
  </div>

  <div class="stat">
    <span>Полностью оценено</span>
    <strong id="complete">—</strong>
  </div>

</div>

<!-- ТАБЛИЦЫ РЕЗУЛЬТАТОВ -->

<div id="streams"></div>

<script>
const socket = io();

const roles = [
  "DA1", "DA2", "DB1", "DB2",
  "E1", "E2", "A1", "A2"
];

const state = {
  gymnasts: [],
  scores: {},
  collapsed: new Set(),
  currentIndex: 0
};

const $ = id => document.getElementById(id);

/* =========================
   ПОДКЛЮЧЕНИЕ
========================= */

socket.on("connect", () => {
  $("connection").textContent = "● Сервер подключён";
});

socket.on("disconnect", () => {
  $("connection").textContent =
    "Нет соединения — переподключение...";
});

socket.on("connect_error", () => {
  $("connection").textContent =
    "Ошибка подключения к серверу";
});

/* =========================
   ПЕРВИЧНАЯ ЗАГРУЗКА
========================= */

socket.on("init_data", data => {
  state.gymnasts = data.gymnasts || [];
  state.scores = data.scores || {};
  state.currentIndex = Number(data.currentIndex) || 0;

  render();
  updateCurrentPerformance();
});

/* =========================
   ОБЩЕЕ ПЕРЕКЛЮЧЕНИЕ
========================= */

socket.on("gymnast_changed", data => {
  state.currentIndex = Number(data.currentIndex) || 0;

  updateCurrentPerformance();
});

/* =========================
   ПОЛУЧЕНИЕ ОЦЕНОК
========================= */

socket.on("score_updated", data => {
  const key = `${data.gymnastId}_${data.judgeRole}`;

  state.scores[key] = Number(data.score);

  render();
});

/* =========================
   ТЕКУЩАЯ ГИМНАСТКА
========================= */

function updateCurrentPerformance() {
  const gymnasts = state.gymnasts;

  if (!gymnasts.length) {
    $("currentName").textContent =
      "Нет данных об участницах";

    $("currentInfo").textContent = "";
    $("currentCounter").textContent = "— / —";

    $("secretaryPrev").disabled = true;
    $("secretaryNext").disabled = true;

    return;
  }

  const index = state.currentIndex;
  const g = gymnasts[index];

  if (!g) return;

  $("currentName").textContent =
    `№${g.number} ${g.name}`;

  $("currentInfo").textContent = [
    g.stream,
    `Вид ${g.stageIndex}: ${g.apparatus}`,
    g.club,
    g.group,
    g.streamTime
  ].filter(Boolean).join(" · ");

  $("currentCounter").textContent =
    `${index + 1} / ${gymnasts.length}`;

  $("secretaryPrev").disabled = index <= 0;

  $("secretaryNext").disabled =
    index >= gymnasts.length - 1;
}

/* =========================
   ПЕРЕКЛЮЧЕНИЕ СЕКРЕТАРЁМ
========================= */

function moveSecretary(delta) {
  const nextIndex = state.currentIndex + delta;

  if (
    nextIndex < 0 ||
    nextIndex >= state.gymnasts.length
  ) {
    return;
  }

  $("navigationStatus").textContent =
    "Переключение...";

  $("secretaryPrev").disabled = true;
  $("secretaryNext").disabled = true;

  socket.timeout(8000).emit(
    "set_gymnast_index",
    nextIndex,
    (error, response) => {

      if (error) {
        $("navigationStatus").textContent =
          "Нет подтверждения от сервера";

        updateCurrentPerformance();
        return;
      }

      if (!response?.ok) {
        $("navigationStatus").textContent =
          response?.error || "Ошибка переключения";

        updateCurrentPerformance();
        return;
      }

      $("navigationStatus").textContent =
        "Текущая гимнастка обновлена у всех судей";
    }
  );
}

$("secretaryPrev").onclick = () =>
  moveSecretary(-1);

$("secretaryNext").onclick = () =>
  moveSecretary(1);

/* =========================
   ПОЛУЧЕНИЕ ОЦЕНКИ СУДЬИ
========================= */

function getScore(id, role) {
  const value = state.scores[`${id}_${role}`];

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {
    return null;
  }

  const number = Number(value);

  return Number.isFinite(number) ? number : null;
}

/* =========================
   СРЕДНЕЕ ДВУХ СУДЕЙ
========================= */

function groupScore(first, second) {
  if (first !== null && second !== null) {
    return (first + second) / 2;
  }

  if (first !== null) return first;
  if (second !== null) return second;

  return null;
}

/* =========================
   ИТОГ ЗА ВЫСТУПЛЕНИЕ
========================= */

function calculateTotal(id) {
  const DA = groupScore(
    getScore(id, "DA1"),
    getScore(id, "DA2")
  );

  const DB = groupScore(
    getScore(id, "DB1"),
    getScore(id, "DB2")
  );

  const E = groupScore(
    getScore(id, "E1"),
    getScore(id, "E2")
  );

  const A = groupScore(
    getScore(id, "A1"),
    getScore(id, "A2")
  );

  if ([DA, DB, E, A].some(value => value === null)) {
    return null;
  }

  return 20 + DA + DB - E - A;
}

/* =========================
   КОЛИЧЕСТВО ОЦЕНОК
========================= */

function scoreCount(g) {
  return roles.filter(role =>
    getScore(g.id, role) !== null
  ).length;
}

/* =========================
   СОЗДАНИЕ ЯЧЕЙКИ
========================= */

function createCell(row, text, className = "") {
  const td = document.createElement("td");

  td.textContent = text ?? "—";
  td.className = className;

  row.append(td);
}

/* =========================
   ФОРМАТ ОЦЕНКИ
========================= */

function formatScore(number) {
  if (number === null) return "—";

  return number.toLocaleString("ru-RU", {
    maximumFractionDigits: 3
  });
}

/* =========================
   ОТРИСОВКА ТАБЛИЦ
========================= */

function render() {
  const query = $("search")
    .value
    .trim()
    .toLocaleLowerCase("ru");

  const all = [...state.gymnasts];

  const filtered = all.filter(g => {
    const fields = [
      g.number,
      g.name,
      g.birthYear,
      g.club,
      g.group,
      g.stream,
      g.apparatus
    ];

    return fields.some(value =>
      String(value || "")
        .toLocaleLowerCase("ru")
        .includes(query)
    );
  });

  /* Общая статистика */

  $("participants").textContent = all.length;

  $("received").textContent = all.reduce(
    (sum, g) => sum + scoreCount(g),
    0
  );

  $("complete").textContent = all.filter(g =>
    calculateTotal(g.id) !== null
  ).length;

  /* Группировка по потокам */

  const groups = new Map();

  for (const g of filtered) {
    if (!groups.has(g.stream)) {
      groups.set(g.stream, []);
    }

    groups.get(g.stream).push(g);
  }

  const container = $("streams");

  container.replaceChildren();

  if (!filtered.length) {
    const p = document.createElement("p");

    p.className = "empty";
    p.textContent = "Выступления не найдены";

    container.append(p);
    return;
  }

  for (const [stream, items] of groups) {
    const card = document.createElement("section");

    card.className = "stream-card";

    /* Заголовок потока */

    const heading = document.createElement("button");

    heading.className = "stream-heading";

    const first = items[0];

    const title = document.createElement("span");
    const strong = document.createElement("strong");
    const small = document.createElement("small");

    strong.textContent = stream;

    small.textContent =
      ` · ${first.streamTime || ""} · ${items.length} выступлений`;

    title.append(strong, small);

    const right = document.createElement("span");

    right.className = "count";

    right.textContent =
      `${items.reduce((sum, g) => sum + scoreCount(g), 0)} оценок`;

    heading.append(title, right);

    const body = document.createElement("div");

    /* Разделение по видам */

    const stages = new Map();

    for (const g of items) {
      if (!stages.has(g.stageIndex)) {
        stages.set(g.stageIndex, []);
      }

      stages.get(g.stageIndex).push(g);
    }

    for (const [stage, rows] of stages) {
      const label = document.createElement("div");

      label.className = "stage-heading";

      label.textContent =
        `Вид ${stage}: ${rows[0].apparatus}`;

      body.append(label);

      const wrap = document.createElement("div");

      wrap.className = "table-wrap";

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      [
        "№",
        "Гимнастка / команда",
        "Год",
        "Клуб / город",
        "Категория",
        "Вид",
        ...roles,
        "Итог за вид",
        "Оценок"
      ].forEach(label => {
        const th = document.createElement("th");

        th.textContent = label;

        headRow.append(th);
      });

      thead.append(headRow);
      table.append(thead);

      const tbody = document.createElement("tbody");

      for (const g of rows) {
        const row = document.createElement("tr");

        createCell(row, g.number);
        createCell(row, g.name, "name");
        createCell(row, g.birthYear);
        createCell(row, g.club, "club");
        createCell(row, g.group);
        createCell(row, g.apparatus);

        for (const role of roles) {
          const score = getScore(g.id, role);

          createCell(
            row,
            formatScore(score),
            `score ${score === null ? "missing" : "received"}`
          );
        }

        const total = calculateTotal(g.id);

        createCell(
          row,
          formatScore(total),
          "total-score"
        );

        createCell(
          row,
          `${scoreCount(g)}/8`,
          "count"
        );

        tbody.append(row);
      }

      table.append(tbody);
      wrap.append(table);
      body.append(wrap);
    }

    if (state.collapsed.has(stream)) {
      body.classList.add("hidden");
    }

    heading.onclick = () => {
      if (state.collapsed.has(stream)) {
        state.collapsed.delete(stream);
      } else {
        state.collapsed.add(stream);
      }

      render();
    };

    card.append(heading, body);
    container.append(card);
  }
}


$("search").addEventListener("input", render);

</script>

</body>
</html>
