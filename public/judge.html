<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель судьи</title>
<script src="/socket.io/socket.io.js"></script>

<style>
:root {
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #293650;
  background: #f5f4f8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 14px;
  background:
    radial-gradient(circle at 12% 8%, rgba(201,187,235,.34), transparent 26rem),
    radial-gradient(circle at 90% 90%, rgba(245,207,219,.35), transparent 25rem),
    #f5f4f8;
}

.card {
  width: min(100%, 500px);
  background: rgba(255,255,255,.96);
  border: 1px solid #e7e2ef;
  border-radius: 24px;
  padding: clamp(19px, 4vw, 28px);
  box-shadow: 0 18px 55px rgba(48,43,76,.10);
}

.card::before {
  content: "GYM SCORES  /  JUDGE PANEL";
  display: block;
  color: #9584bd;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 1.7px;
  margin-bottom: 9px;
}

label {
  display: block;
  color: #77758b;
  font-size: 12px;
  font-weight: 750;
}

select, button {
  font: inherit;
  border: 0;
  border-radius: 11px;
}

select {
  width: 100%;
  background: #f7f5fb;
  color: #293650;
  border: 1px solid #e4dfed;
  margin: 8px 0 17px;
  padding: 13px 14px;
  outline: none;
}

select:focus {
  border-color: #9a87c9;
  box-shadow: 0 0 0 3px rgba(154,135,201,.15);
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.nav button {
  background: #eeeaf6;
  color: #625486;
  padding: 11px 14px;
  font-weight: 750;
  cursor: pointer;
  transition: .15s;
}

.nav button:hover:not(:disabled) { background: #e4def0; }
.nav button:disabled { opacity: .38; cursor: not-allowed; }

.counter {
  font-size: 11px;
  color: #89869a;
  text-align: center;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stage {
  display: inline-flex;
  align-items: center;
  margin-top: 23px;
  padding: 7px 11px;
  border-radius: 999px;
  background: #f1edf8;
  color: #806cae;
  font-size: 13px;
  font-weight: 850;
}

.name {
  font-size: clamp(23px, 5vw, 29px);
  line-height: 1.2;
  font-weight: 850;
  color: #293650;
  margin: 12px 0 6px;
  letter-spacing: -.5px;
}

.club {
  color: #85869a;
  min-height: 22px;
  font-size: 13px;
  line-height: 1.55;
}

.warning {
  color: #946b29;
  background: #fff7e8;
  border: 1px solid #f4e2bd;
  border-radius: 10px;
  font-size: 12px;
  padding: 9px 11px;
  margin: 12px 0;
}

.display {
  background: #f8f7fb;
  border: 1px solid #e6e1ef;
  border-radius: 16px;
  text-align: right;
  padding: 13px 18px;
  font-size: 46px;
  line-height: 1.2;
  font-weight: 800;
  letter-spacing: -1px;
  color: #5f9c8a;
  margin: 20px 0 14px;
  font-variant-numeric: tabular-nums;
  min-height: 76px;
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.pad button {
  font-size: 23px;
  font-weight: 700;
  background: #f1eff6;
  color: #3f4962;
  padding: 15px 8px;
  cursor: pointer;
  transition: background .15s, transform .15s;
}

.pad button:hover {
  background: #e8e3f1;
  transform: translateY(-1px);
}

.pad button:active { transform: scale(.98); }

.submit {
  width: 100%;
  margin-top: 15px;
  background: #659b89;
  color: white;
  font-weight: 800;
  font-size: 16px;
  padding: 16px;
  cursor: pointer;
  box-shadow: 0 7px 16px rgba(76,139,118,.18);
  transition: background .15s, transform .15s;
}

.submit:hover:not(:disabled) {
  background: #528674;
  transform: translateY(-1px);
}

.submit:disabled { opacity: .55; cursor: wait; }

.status {
  font-size: 12px;
  line-height: 1.5;
  min-height: 22px;
  color: #85869a;
  margin-top: 13px;
  text-align: center;
}

@media (max-width: 390px) {
  .card { padding: 17px; border-radius: 19px; }
  .nav button { padding: 10px 9px; font-size: 13px; }
  .pad { gap: 7px; }
  .pad button { padding: 14px 6px; }
}
</style>
</head>

<body>
<main class="card">

  <label for="judgeRole">Ваша судейская роль</label>

  <select id="judgeRole">
    <option>DA1</option>
    <option>DA2</option>
    <option>DB1</option>
    <option>DB2</option>
    <option>E1</option>
    <option>E2</option>
    <option>A1</option>
    <option>A2</option>
  </select>

  <div class="nav">
    <button id="prev">‹ Назад</button>
    <span class="counter" id="counter">Подключение…</span>
    <button id="next">Вперёд ›</button>
  </div>

  <div class="stage" id="stage"></div>
  <div class="name" id="gymnastName">Загрузка списка…</div>
  <div class="club" id="gymnastClub"></div>

  <div class="warning" id="warning" hidden>
    Выбрано не текущее выступление секретаря.
  </div>

  <div class="display" id="display">0</div>

  <div class="pad">
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>
    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>
    <button data-key=".">.</button>
    <button data-key="0">0</button>
    <button id="backspace">⌫</button>
  </div>

  <button class="submit" id="submit">
    Отправить оценку
  </button>

  <div class="status" id="status">
    Подключение к серверу…
  </div>

</main>

<script>
const socket = io();
const $ = id => document.getElementById(id);

let gymnasts = [];
let currentIndex = 0;
let secretaryIndex = 0;
let currentInput = "";
let currentGymnastId = null;

function showInput() {
  $("display").textContent = currentInput || "0";
}

function clearInput() {
  currentInput = "";
  showInput();
}

function update() {
  if (!gymnasts.length) {
    $("counter").textContent = "Список выступлений пуст";
    $("gymnastName").textContent = "Нет выступлений";
    $("stage").textContent = "";
    $("gymnastClub").textContent = "";
    currentGymnastId = null;
    return;
  }

  currentIndex = Math.max(
    0,
    Math.min(currentIndex, gymnasts.length - 1)
  );

  const g = gymnasts[currentIndex];

  currentGymnastId = g.id;

  $("counter").textContent =
    `Выступление ${currentIndex + 1} / ${gymnasts.length}`;

  $("stage").textContent =
    `${g.stream} · ${g.apparatus}`;

  $("gymnastName").textContent =
    `№${g.number} ${g.name}`;

  $("gymnastClub").textContent =
    [g.club, g.group, g.streamTime]
      .filter(Boolean)
      .join(" · ");

  $("warning").hidden =
    currentIndex === secretaryIndex;

  $("prev").disabled = currentIndex === 0;
  $("next").disabled = currentIndex === gymnasts.length - 1;
}

socket.on("connect", () => {
  $("status").textContent = "Соединение установлено";
});

socket.on("disconnect", () => {
  $("status").textContent =
    "Нет соединения. Повторное подключение…";
});

socket.on("init_data", data => {
  gymnasts = data.gymnasts || [];
  secretaryIndex = data.currentIndex || 0;
  currentIndex = secretaryIndex;

  update();
});

socket.on("gymnast_changed", data => {
  secretaryIndex = data.currentIndex;
  currentIndex = data.currentIndex;

  clearInput();
  update();
});

document.querySelectorAll("[data-key]").forEach(button => {
  button.onclick = () => {
    const key = button.dataset.key;

    if (key === "." && currentInput.includes(".")) return;
    if (currentInput.length >= 8) return;

    if (key === "." && !currentInput) {
      currentInput = "0";
    }

    currentInput += key;
    showInput();
  };
});

$("backspace").onclick = () => {
  currentInput = currentInput.slice(0, -1);
  showInput();
};

// Ручное переключение остаётся локальным для судьи.
function move(delta) {
  const nextIndex = currentIndex + delta;

  if (nextIndex < 0 || nextIndex >= gymnasts.length) {
    return;
  }

  currentIndex = nextIndex;

  clearInput();
  update();
}

$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);

$("judgeRole").onchange = clearInput;

$("submit").onclick = () => {
  if (!currentInput || !currentGymnastId) {
    $("status").textContent = "Введите оценку.";
    return;
  }

  const score = Number(currentInput);

  if (!Number.isFinite(score) || score < 0 || score > 100) {
    $("status").textContent =
      "Оценка должна быть от 0 до 100.";
    return;
  }

  const submittedGymnastId = currentGymnastId;
  const submittedIndex = currentIndex;

  $("submit").disabled = true;
  $("status").textContent = "Сохранение…";

  socket.timeout(8000).emit(
    "submit_score",
    {
      gymnastId: submittedGymnastId,
      judgeRole: $("judgeRole").value,
      score
    },
    (error, response) => {
      $("submit").disabled = false;

      if (error) {
        $("status").textContent =
          "Нет подтверждения от сервера. Проверьте соединение.";
        return;
      }

      if (!response?.ok) {
        $("status").textContent =
          response?.error || "Ошибка сохранения.";
        return;
      }

      clearInput();

      // Переходим дальше только после подтверждения сервера.
      if (
        currentGymnastId === submittedGymnastId &&
        currentIndex === submittedIndex
      ) {
        if (currentIndex < gymnasts.length - 1) {
          currentIndex++;
          update();

          $("status").textContent =
            `Оценка ${response.score} сохранена. Следующая гимнастка.`;
        } else {
          $("status").textContent =
            `Оценка ${response.score} сохранена. Это последнее выступление.`;
        }
      } else {
        $("status").textContent =
          `Оценка ${response.score} сохранена.`;
      }
    }
  );
};
</script>

</body>
</html>
