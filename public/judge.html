<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Панель судьи</title>
<script src="/socket.io/socket.io.js"></script>

<style>
:root {
  color-scheme: dark;
  font-family: system-ui, Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #0b1220;
  color: #f8fafc;
  display: grid;
  place-items: center;
  padding: 16px;
}

.card {
  width: min(100%, 470px);
  background: #172033;
  border: 1px solid #29364e;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 20px 60px #0005;
}

select, button {
  font: inherit;
  border: 0;
  border-radius: 10px;
  padding: 12px;
}

select {
  width: 100%;
  background: #26334a;
  color: white;
  margin: 8px 0 14px;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.nav button {
  background: #334155;
  color: white;
}

.counter {
  font-size: 12px;
  color: #aab7cc;
  text-align: center;
}

.stage {
  font-size: 18px;
  font-weight: 800;
  color: #facc15;
  margin-top: 18px;
}

.name {
  font-size: 23px;
  font-weight: 750;
  color: #7dd3fc;
  margin: 8px 0 4px;
}

.club {
  color: #aab7cc;
  min-height: 22px;
  font-size: 13px;
}

.display {
  background: #05080f;
  border: 1px solid #344158;
  border-radius: 12px;
  text-align: right;
  padding: 12px 16px;
  font-size: 42px;
  color: #5eead4;
  margin: 18px 0;
}

.pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.pad button {
  font-size: 24px;
  background: #26334a;
  color: white;
  padding: 16px 8px;
}

.submit {
  width: 100%;
  margin-top: 14px;
  background: #059669;
  color: white;
  font-weight: 750;
  font-size: 18px;
  padding: 15px;
}

.status {
  font-size: 13px;
  min-height: 22px;
  color: #aab7cc;
  margin-top: 12px;
}

.warning {
  color: #fbbf24;
  font-size: 13px;
  margin: 8px 0;
}
</style>
</head>

<body>
<main class="card">

  <label for="judgeRole">Ваша судейская роль</label>

  <select id="judgeRole">
    <option>DA1</option>
    <option>DA2</option>
    <option>DB1</option>
    <option>DB2</option>
    <option>E1</option>
    <option>E2</option>
    <option>A1</option>
    <option>A2</option>
  </select>

  <div class="nav">
    <button id="prev">‹ Назад</button>
    <span class="counter" id="counter">Подключение…</span>
    <button id="next">Вперёд ›</button>
  </div>

  <div class="stage" id="stage"></div>
  <div class="name" id="gymnastName">Загрузка списка…</div>
  <div class="club" id="gymnastClub"></div>

  <div class="warning" id="warning" hidden>
    Выбрано не текущее выступление секретаря.
  </div>

  <div class="display" id="display">0</div>

  <div class="pad">
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>
    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>
    <button data-key=".">.</button>
    <button data-key="0">0</button>
    <button id="backspace">⌫</button>
  </div>

  <button class="submit" id="submit">
    Отправить оценку
  </button>

  <div class="status" id="status">
    Подключение к серверу…
  </div>

</main>

<script>
const socket = io();
const $ = id => document.getElementById(id);

let gymnasts = [];
let currentIndex = 0;
let secretaryIndex = 0;
let currentInput = "";
let currentGymnastId = null;

function showInput() {
  $("display").textContent = currentInput || "0";
}

function clearInput() {
  currentInput = "";
  showInput();
}

function update() {
  if (!gymnasts.length) return;

  currentIndex = Math.max(
    0,
    Math.min(currentIndex, gymnasts.length - 1)
  );

  const g = gymnasts[currentIndex];

  currentGymnastId = g.id;

  $("counter").textContent =
    `Выступление ${currentIndex + 1} / ${gymnasts.length}`;

  $("stage").textContent =
    `${g.stream} · ${g.apparatus}`;

  $("gymnastName").textContent =
    `№${g.number} ${g.name}`;

  $("gymnastClub").textContent =
    [g.club, g.group, g.streamTime]
      .filter(Boolean)
      .join(" · ");

  $("warning").hidden =
    currentIndex === secretaryIndex;
}

socket.on("connect", () => {
  $("status").textContent = "Соединение установлено";
});

socket.on("disconnect", () => {
  $("status").textContent =
    "Нет соединения. Повторное подключение…";
});

socket.on("init_data", data => {
  gymnasts = data.gymnasts || [];
  secretaryIndex = data.currentIndex || 0;
  currentIndex = secretaryIndex;

  update();
});

socket.on("gymnast_changed", data => {
  secretaryIndex = data.currentIndex;
  currentIndex = data.currentIndex;

  clearInput();
  update();
});

document.querySelectorAll("[data-key]").forEach(button => {
  button.onclick = () => {
    const key = button.dataset.key;

    if (key === "." && currentInput.includes(".")) return;
    if (currentInput.length >= 8) return;

    if (key === "." && !currentInput) {
      currentInput = "0";
    }

    currentInput += key;
    showInput();
  };
});

$("backspace").onclick = () => {
  currentInput = currentInput.slice(0, -1);
  showInput();
};

function move(delta) {
  const nextIndex = currentIndex + delta;

  if (nextIndex < 0 || nextIndex >= gymnasts.length) {
    return;
  }

  currentIndex = nextIndex;

  clearInput();
  update();

  socket.emit("set_gymnast_index", currentIndex);
}

$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);

$("judgeRole").onchange = clearInput;

$("submit").onclick = () => {
  if (!currentInput || !currentGymnastId) {
    $("status").textContent = "Введите оценку.";
    return;
  }

  const score = Number(currentInput);

  if (!Number.isFinite(score) || score < 0 || score > 100) {
    $("status").textContent =
      "Оценка должна быть от 0 до 100.";
    return;
  }

  $("submit").disabled = true;
  $("status").textContent = "Сохранение…";

  socket.timeout(8000).emit(
    "submit_score",
    {
      gymnastId: currentGymnastId,
      judgeRole: $("judgeRole").value,
      score
    },
    (error, response) => {
      $("submit").disabled = false;

      if (error) {
        $("status").textContent =
          "Нет подтверждения от сервера.";
        return;
      }

      if (!response?.ok) {
        $("status").textContent =
          response?.error || "Ошибка сохранения.";
        return;
      }

      $("status").textContent =
        `Оценка ${response.score} сохранена.`;

      clearInput();
    }
  );
};
</script>

</body>
</html>
